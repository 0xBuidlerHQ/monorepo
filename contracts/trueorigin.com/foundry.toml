[profile.default]
src = "src"
test = "test"
match_path = "test/unit/**"
script = "script"
out = "out"
cache_path = "cache"
no_storage_caching = true
libs = ["dependencies"]
remappings = ["@openzeppelin/contracts/=dependencies/openzeppelin-contracts-5.6.1/contracts/"]
optimizer = true
optimizer_runs = 200

solc_version = "0.8.30"
evm_version = "prague"

[profile.default.fuzz]
runs = 256

[profile.integration]
match_path = "test/integration/**"

[rpc_endpoints]
local = "http://127.0.0.1:8545"
ethereum = "${ETHEREUM_RPC_URL}"

[soldeer]
remappings_generate = false

[dependencies]
openzeppelin-contracts = { version = "5.6.1", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", rev = "5fd1781b1454fd1ef8e722282f86f9293cacf256" }
